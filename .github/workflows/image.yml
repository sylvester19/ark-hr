name: image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start.sh
      - requirements.txt
      - src/**
      - web/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sylvester19/ark-hr:1
      - name: Make the image public so Azure can pull it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "/repos/${{ github.repository }}/packages/container/ark-hr" -f visibility=public
