name: packages

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Find the container package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query { viewer { packages(first: 20, packageType: DOCKER) { nodes { name } } } }' || true
          gh api --method PATCH /user/packages/container/ark-hr -f visibility=public || true
          gh api --method PATCH /repos/sylvester19/ark-hr/packages/container/ark-hr -f visibility=public || true
